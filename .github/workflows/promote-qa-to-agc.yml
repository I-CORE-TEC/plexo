name: Open AGC promotion PR

on:
  pull_request_target:
    branches: [qa]
    types: [closed]

permissions: {}

concurrency:
  group: qa-to-agc-promotion
  cancel-in-progress: false

jobs:
  open-promotion:
    if: github.repository == 'I-CORE-TEC/plexo' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: agc-promotion
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/qa
          persist-credentials: false
      - name: Verify promotion behavior
        run: node --test .github/scripts/promote-qa-to-agc.test.mjs
      - name: Mint a repository-scoped promotion token
        id: promotion-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGC_PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGC_PROMOTION_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Open or reuse QA-to-AGC pull request
        env:
          GH_TOKEN: ${{ steps.promotion-token.outputs.token }}
        run: node .github/scripts/promote-qa-to-agc.mjs